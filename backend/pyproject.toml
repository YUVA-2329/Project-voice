[project]
name = "project-voice-backend"
version = "0.1.0"
description = "PROJECT VOICE — API and worker for the personal voice-cloning platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "rq>=1.16",
  "redis>=5.0",
  "structlog>=24.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "psutil>=5.9",
  "httpx>=0.27",
  "aiofiles>=23.2",
  "uuid7>=0.1",
  "websockets>=12.0",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Conversation mode inside the API process: Silero VAD + Whisper via ONNX Runtime only (no torch).
realtime = [
  "sherpa-onnx>=1.10",
]
engine = [
  "librosa>=0.10",
  "torch>=2.2",
  "sherpa-onnx>=1.10",
  "faster-whisper>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
pv = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "ASYNC", "S", "RUF"]
ignore = [
  "S101",  # asserts are fine in tests and for invariants
  "S104",  # binding 0.0.0.0 is intentional in containers
  "S603",  # subprocess with validated args (ffprobe)
  "S607",  # partial executable path for ffprobe is configuration-driven
  "B008",  # FastAPI Depends() in defaults
  "RUF012",
  "UP040",  # keep TypeAlias for 3.11 compatibility
  "N818",  # HTTP-style domain error names (NotFound, Forbidden) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "ASYNC"]
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/"]

# --------------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
  "ignore::DeprecationWarning",
]
addopts = "-p no:cacheprovider"
